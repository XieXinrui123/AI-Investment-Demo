name: RRI AEM Eastmoney Market PPE Probe

on:
  push:
    branches: ["rri-aem-20260906"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip requests pandas
      - name: Probe whole-market annual balance sheet endpoint
        run: |
          mkdir -p rri_aem_em_probe
          python - <<'PY' > rri_aem_em_probe/probe.txt 2>&1
          import requests, json, pandas as pd
          url='https://datacenter-web.eastmoney.com/api/data/v1/get'
          base={
            'reportName':'RPT_DMSK_FN_BALANCE',
            'columns':'SECURITY_CODE,SECURITY_NAME_ABBR,REPORT_DATE,NOTICE_DATE,FIXED_ASSET,TOTAL_ASSETS,ACCOUNTS_RECE,MONETARYFUNDS',
            'pageNumber':'1','pageSize':'500','sortColumns':'SECURITY_CODE','sortTypes':'1',
            'filter':"(REPORT_DATE='2023-12-31')"
          }
          h={'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'}
          r=requests.get(url,params=base,headers=h,timeout=40)
          print('URL',r.url); print('status',r.status_code,'bytes',len(r.content)); print(r.text[:1000])
          j=r.json(); print('success',j.get('success'),'message',j.get('message'))
          res=j.get('result') or {}; print('pages',res.get('pages'),'count',res.get('count'))
          data=res.get('data') or []; print('rows page1',len(data))
          if data: print(pd.DataFrame(data).head(10).to_string(index=False)); print('keys',list(data[0].keys()))
          # also a second year to ensure historical filter works
          for y in [2015,2014]:
            p=base.copy(); p['filter']=f"(REPORT_DATE='{y}-12-31')"; p['pageSize']='10'
            q=requests.get(url,params=p,headers=h,timeout=40).json(); rr=q.get('result') or {}
            print('YEAR',y,'success',q.get('success'),'pages',rr.get('pages'),'count',rr.get('count'),'sample', (rr.get('data') or [])[:2])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rri-aem-em-market-probe-${{ github.run_id }}
          path: rri_aem_em_probe
