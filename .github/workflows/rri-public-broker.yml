name: RRI Open Financial Panel Probe

on:
  push:
    branches: ["rri-run-20260906"]

jobs:
  probe-financial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip requests pandas pyarrow
      - name: Inspect open financial parquet tree
        run: |
          mkdir -p rri_run/financial_probe
          python - <<'PY' > rri_run/financial_probe/probe.txt 2>&1
          import requests, json
          repo='yifishbossman/financial-analyst-data-full'
          urls=[
            f'https://huggingface.co/api/datasets/{repo}/tree/main/parquet/financial?recursive=false&expand=false',
            f'https://huggingface.co/api/datasets/{repo}/tree/main/parquet?recursive=false&expand=false',
          ]
          for u in urls:
            print('\nURL',u)
            r=requests.get(u,timeout=120)
            print('STATUS',r.status_code,'BYTES',len(r.content))
            print(r.text[:50000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rri-financial-probe-${{ github.run_id }}
          path: rri_run/financial_probe
