name: RRI Sina Deep History Probe

on:
  push:
    branches: ["rri-run-20260906"]
  workflow_dispatch:

jobs:
  probe-sina-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests pandas lxml
      - name: Probe deep history by stock and page
        run: |
          mkdir -p rri_run/sina_probe
          python - <<'PY' > rri_run/sina_probe/deep_probe.txt 2>&1
          import io,requests,pandas as pd
          base='https://stock.finance.sina.com.cn/stock/go.php/vPerformancePrediction/kind/eps/index.phtml'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://finance.sina.com.cn/'})
          symbols=['sh600000','sz000703','sz002502','sz300124','sh601666','sh603588']
          pages=[1,2,5,10,20,50,100,200,300,500,1000]
          for sym in symbols:
            print('\nSYMBOL',sym)
            for p in pages:
              u=f'{base}?symbol={sym}&p={p}&num=60'
              try:
                r=s.get(u,timeout=20); r.encoding=r.apparent_encoding or r.encoding
                tabs=pd.read_html(io.StringIO(r.text))
                target=None
                for t in tabs:
                  if '报告日期' in '|'.join(map(str,t.columns)):
                    target=t; break
                if target is None:
                  print('PAGE',p,'NO_TARGET_TABLE','len',len(r.text)); continue
                d=pd.to_datetime(target['报告日期'],errors='coerce').dropna()
                print('PAGE',p,'N',len(target),'MAX',d.max().date() if len(d) else None,'MIN',d.min().date() if len(d) else None)
                if len(target)==0: break
              except Exception as e:
                print('PAGE',p,'ERR',repr(e))
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: rri-sina-deep-probe-${{ github.run_id }}
          path: rri_run/sina_probe
          if-no-files-found: error
