name: RRI HuggingFace Open F10 Probe

on:
  push:
    branches: ["rri-run-20260906"]
  workflow_dispatch:

jobs:
  probe-hf-f10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests pandas
      - name: Probe open F10 historical analyst forecasts
        run: |
          mkdir -p rri_run/hf_f10_probe
          python - <<'PY' > rri_run/hf_f10_probe/probe.txt 2>&1
          import requests,re,urllib.parse
          repo='yifishbossman/financial-analyst-data-full'
          samples=[
            ('600754','2015-01-17'),('601919','2015-12-25'),('300058','2015-11-13'),
            ('000938','2015-10-28'),('600879','2015-09-16'),('600271','2018-06-01'),
            ('300124','2018-06-01'),('002502','2019-06-01'),('603588','2020-06-01'),
            ('601666','2020-06-01'),('688102','2023-06-01'),('688551','2023-06-01')
          ]
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          for code,event in samples:
            folder=('sh' if code.startswith(('5','6','9')) else 'sz')+code
            api=f'https://huggingface.co/api/datasets/{repo}/tree/main/{folder}'
            try:
              r=s.get(api,params={'limit':100},timeout=30)
              print('\nCODE',code,'EVENT',event,'LIST_STATUS',r.status_code,'LEN',len(r.text))
              if r.status_code!=200:
                print(r.text[:500]); continue
              items=r.json()
              names=[x.get('path','') for x in items if '研究报告_' in x.get('path','') and x.get('path','').endswith('.txt')]
              print('REPORT_FILES',len(names),names[-8:])
              if not names: continue
              # inspect the largest/newest-named snapshot; these F10 snapshots preserve historical report rows
              path=sorted(names)[-1]
              raw='https://huggingface.co/datasets/'+repo+'/resolve/main/'+urllib.parse.quote(path,safe='/')
              rr=s.get(raw,timeout=60)
              print('FETCH',path,rr.status_code,'BYTES',len(rr.content))
              if rr.status_code!=200: continue
              rr.encoding=rr.apparent_encoding or 'utf-8'
              txt=rr.text
              print('HAS_EPS_SECTION','每股收益预测' in txt,'TEXT_LEN',len(txt))
              pos=txt.find('每股收益预测')
              if pos>=0:
                block=txt[pos:pos+12000]
                dates=re.findall(r'20\d{2}-\d{2}-\d{2}',block)
                # preserve order, unique
                uniq=[]
                for d in dates:
                  if d not in uniq: uniq.append(d)
                print('EPS_DATES_N',len(uniq),'FIRST_LAST',uniq[-5:] if uniq else [],uniq[:5] if uniq else [])
                print('EARLIEST',min(uniq) if uniq else None,'LATEST',max(uniq) if uniq else None)
                print('BLOCK_HEAD',block[:2500].replace('\r',''))
            except Exception as e:
              print('ERR',code,repr(e))
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: rri-hf-f10-probe-${{ github.run_id }}
          path: rri_run/hf_f10_probe
          if-no-files-found: error
