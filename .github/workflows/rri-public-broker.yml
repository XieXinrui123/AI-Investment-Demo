name: RRI Eastmoney F10 Forecast Probe

on:
  push:
    branches: ["rri-run-20260906"]
  workflow_dispatch:

jobs:
  probe-em-f10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests pandas
      - name: Probe Eastmoney F10 historical forecast detail
        run: |
          mkdir -p rri_run/em_f10_probe
          python - <<'PY' > rri_run/em_f10_probe/probe.txt 2>&1
          import requests, json, pandas as pd
          samples=['600754','601919','300058','000938','600879','600271','300124','002502','603588','601666']
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://emweb.securities.eastmoney.com/'})
          for code in samples:
            market='SH' if code.startswith(('5','6','9')) else 'SZ'
            for ep in ['ProfitForecastAjax','PageAjax']:
              u=f'https://emweb.securities.eastmoney.com/PC_HSF10/ProfitForecast/{ep}?code={market}{code}'
              try:
                r=s.get(u,timeout=25)
                print('\nCODE',code,'EP',ep,'STATUS',r.status_code,'LEN',len(r.text),'CT',r.headers.get('content-type'))
                print('HEAD',r.text[:180].replace('\n',' '))
                if r.status_code!=200: continue
                js=r.json()
                root=js.get('Result',js)
                # old endpoint
                if isinstance(root,dict) and 'ycmx' in root:
                  mg=(root.get('ycmx') or {}).get('mgsy') or {}
                  data=mg.get('data') or []
                  print('OLD_BASEYEAR',mg.get('baseYear'),'ROWS',len(data))
                  dates=[str(x.get('sj','')) for x in data if x.get('sj')]
                  print('DATES_FIRST_LAST',dates[:3],dates[-3:])
                  print('ROW_SAMPLE',data[:2])
                # new endpoint likely jgyc/ycmx
                if isinstance(root,dict):
                  print('ROOT_KEYS',list(root)[:30])
                  for k,v in root.items():
                    if isinstance(v,list):
                      print('LIST',k,'N',len(v),'SAMPLE',v[:2])
                    elif isinstance(v,dict):
                      for kk,vv in v.items():
                        if isinstance(vv,list): print('NESTED_LIST',k,kk,'N',len(vv),'SAMPLE',vv[:2])
              except Exception as e: print('ERR',code,ep,repr(e))
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: rri-em-f10-probe-${{ github.run_id }}
          path: rri_run/em_f10_probe
          if-no-files-found: error
