name: RRI Sina Forecast Probe

on:
  push:
    branches: ["rri-run-20260906"]
  workflow_dispatch:

jobs:
  probe-sina:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests pandas beautifulsoup4 lxml
      - name: Probe Sina analyst forecast archive
        run: |
          mkdir -p rri_run/sina_probe
          python - <<'PY' > rri_run/sina_probe/probe.txt 2>&1
          import io, re, requests, pandas as pd
          from bs4 import BeautifulSoup
          base='https://stock.finance.sina.com.cn/stock/go.php/vPerformancePrediction/kind/eps/index.phtml'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://finance.sina.com.cn/'})
          tests=[
              base,
              base+'?p=2&num=60',
              base+'?p=10&num=60',
              base+'?p=100&num=60',
              base+'?page=2&num=60',
              base+'?pageNo=2&num=60',
              base+'?symbol=sh600000&num=60',
              base+'?code=600000&num=60',
          ]
          for u in tests:
              try:
                  r=s.get(u,timeout=20); r.encoding=r.apparent_encoding or r.encoding
                  print('\nURL',u,'STATUS',r.status_code,'LEN',len(r.text),'FINAL',r.url)
                  soup=BeautifulSoup(r.text,'lxml')
                  dates=[x for x in soup.stripped_strings if re.fullmatch(r'20\d{2}-\d{2}-\d{2}',x)]
                  print('DATE_RANGE',dates[:3],dates[-3:] if dates else [],'N_DATES',len(dates))
                  tabs=pd.read_html(io.StringIO(r.text))
                  print('TABLE_SHAPES',[t.shape for t in tabs])
                  for t in tabs:
                      cols='|'.join(map(str,t.columns))
                      if '报告日期' in cols or '股票代码' in cols:
                          print('TARGET',t.shape)
                          print(t.head(5).to_string(index=False))
                          break
                  if u==base:
                      print('FORMS')
                      for f in soup.find_all('form'):
                          print('FORM',f.get('action'),f.get('method'))
                          for i in f.find_all(['input','select','option']):
                              if i.get('name') or i.name=='option': print(i.name,i.get('name'),i.get('value'),i.get_text(' ',strip=True)[:80])
                      print('PAGING_LINKS')
                      for a in soup.find_all('a',href=True):
                          h=a['href']; text=a.get_text(' ',strip=True)
                          if 'vPerformancePrediction' in h and ('p/' in h or 'p=' in h or 'num/' in h or 'num=' in h): print(text,h)
              except Exception as e:
                  print('ERR',u,repr(e))
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: rri-sina-probe-${{ github.run_id }}
          path: rri_run/sina_probe
          if-no-files-found: error
