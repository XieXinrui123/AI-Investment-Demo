name: RRI Annual CSMAR DTA Probe
on:
  push:
    branches: [rri-operating-experiment]
    paths:
      - '.github/workflows/rri-dta-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pandas
        run: pip install pandas pyreadstat
      - name: Pull public annual CSMAR controls through Git LFS
        run: |
          git lfs install
          git clone --depth 1 https://github.com/renzhongxing9/Ashare-control-vars.git external_controls
          cd external_controls
          git lfs pull --include='data/c_output/ControlVars_Y.dta'
          ls -lh data/c_output/ControlVars_Y.dta
      - name: Inspect annual data
        run: |
          python - <<'PY'
          import pandas as pd
          p='external_controls/data/c_output/ControlVars_Y.dta'
          d=pd.read_stata(p,convert_categoricals=False)
          print('SHAPE',d.shape)
          print('COLUMNS',list(d.columns))
          print('YEARS',d['YEAR'].min(),d['YEAR'].max() if 'YEAR' in d else 'NA')
          need=['STKCD','YEAR','INDCD','ROA','GROWTH','LEV','SIZE','TAT']
          print('NEED_PRESENT',{x:(x in d.columns) for x in need})
          print(d[[x for x in need if x in d.columns]].tail(10).to_string(index=False))
          PY
