name: RRI Operating Performance Experiment
on:
  push:
    branches: [rri-operating-experiment]
    paths:
      - 'rri_experiment/run_rri_operating_public.py'
      - 'rri_experiment/RRI_FIRM_YEAR_v2.3m_ACTIONS_INPUT.csv.zlib.b64'
      - '.github/workflows/rri-operating-experiment.yml'
  workflow_dispatch:

jobs:
  run-rri-operating:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install pandas numpy statsmodels pyreadstat
      - name: Pull verified annual CSMAR-derived controls
        run: |
          git lfs install
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://github.com/renzhongxing9/Ashare-control-vars.git external_controls
          cd external_controls
          git lfs pull --include='data/c_output/ControlVars_Y.dta'
          ls -lh data/c_output/ControlVars_Y.dta
      - name: Download annual Zenodo balance-sheet segments for frozen Cash control
        run: |
          set -euxo pipefail
          mkdir -p rri_experiment/zenodo_balance
          curl -L --fail --retry 3 --connect-timeout 30 -o 'rri_experiment/zenodo_balance/2012.1.1-2017.4.30资产负债.csv' 'https://zenodo.org/records/20032245/files/2012.1.1-2017.4.30%E8%B5%84%E4%BA%A7%E8%B4%9F%E5%80%BA.csv?download=1'
          curl -L --fail --retry 3 --connect-timeout 30 -o 'rri_experiment/zenodo_balance/2017.5.1-2020.12.31资产负债.csv' 'https://zenodo.org/records/20032245/files/2017.5.1-2020.12.31%E8%B5%84%E4%BA%A7%E8%B4%9F%E5%80%BA.csv?download=1'
          curl -L --fail --retry 3 --connect-timeout 30 -o 'rri_experiment/zenodo_balance/2021.1.1-2023.4.30资产负债.csv' 'https://zenodo.org/records/20032245/files/2021.1.1-2023.4.30%E8%B5%84%E4%BA%A7%E8%B4%9F%E5%80%BA.csv?download=1'
          curl -L --fail --retry 3 --connect-timeout 30 -o 'rri_experiment/zenodo_balance/2023.5.1-2025.12.31资产负债.csv' 'https://zenodo.org/records/20032245/files/2023.5.1-2025.12.31%E8%B5%84%E4%BA%A7%E8%B4%9F%E5%80%BA.csv?download=1'
          ls -lh rri_experiment/zenodo_balance/
      - name: Run frozen RRI operating-performance experiment
        run: python rri_experiment/run_rri_operating_public.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rri-operating-results
          path: rri_experiment/results/
          if-no-files-found: warn
