name: RRI AEM Financial Field Probe

on:
  push:
    branches: ["rri-aem-20260906"]

jobs:
  probe-fields:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pandas requests pyarrow
      - name: Probe public financial parquet schemas and AEM coverage fields
        run: |
          mkdir -p rri_aem_probe
          python - <<'PY' > rri_aem_probe/probe.txt 2>&1
          import io, requests, pandas as pd
          root='https://huggingface.co/datasets/yifishbossman/financial-analyst-data-full/resolve/main/parquet/financial'
          for fn in ['balance_sheet.parquet','profit_sheet.parquet','cash_flow.parquet']:
              print('\n===',fn,'===')
              r=requests.get(f'{root}/{fn}',timeout=180,headers={'User-Agent':'Mozilla/5.0'})
              print('status',r.status_code,'bytes',len(r.content)); r.raise_for_status()
              d=pd.read_parquet(io.BytesIO(r.content))
              print('shape',d.shape)
              print('columns',list(d.columns))
              cand=[c for c in d.columns if any(k in c.lower() for k in ['asset','receiv','ppe','fix','cash','income','revenue','depr','cfo','operat','n_cashflow','end_date','ann_date'])]
              print('candidate cols',cand)
              print(d[cand[:30]].head(3).to_string(index=False) if cand else d.head(3).to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rri-aem-field-probe-${{ github.run_id }}
          path: rri_aem_probe
