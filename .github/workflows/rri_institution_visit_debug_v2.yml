name: Debug Eastmoney Institution Visit Filters v2

on:
  push:
    branches: [rri-institution-visit-pilot-20260907]
    paths: ['.github/workflows/rri_institution_visit_debug_v2.yml']

jobs:
  debug-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: |
          python - <<'PY'
          import requests, json
          u='https://datacenter-web.eastmoney.com/api/data/v1/get'
          tests={
            'all_since_2024':'(NUMBERNEW="1")(IS_SOURCE="1")(NOTICE_DATE>\'2024-01-01\')',
            '603300_since_2024':'(NUMBERNEW="1")(IS_SOURCE="1")(SECURITY_CODE="603300")(RECEIVE_START_DATE>\'2024-01-01\')',
            '603300_window':'(NUMBERNEW="1")(IS_SOURCE="1")(SECURITY_CODE="603300")(RECEIVE_START_DATE>=\'2024-02-10\')(RECEIVE_START_DATE<=\'2024-08-08\')',
            '300260_window':'(NUMBERNEW="1")(IS_SOURCE="1")(SECURITY_CODE="300260")(RECEIVE_START_DATE>=\'2024-02-22\')(RECEIVE_START_DATE<=\'2024-08-20\')'
          }
          for n,f in tests.items():
            p={'sortColumns':'NOTICE_DATE,SUM,RECEIVE_START_DATE,SECURITY_CODE','sortTypes':'-1,-1,-1,1','pageSize':'5','pageNumber':'1','reportName':'RPT_ORG_SURVEYNEW','columns':'ALL','source':'WEB','client':'WEB','filter':f}
            o=requests.get(u,params=p,timeout=30).json(); print('\n',n,'success',o.get('success'),'code',o.get('code'),'msg',o.get('message'))
            r=o.get('result'); print('result null?',r is None)
            if r:
              print('count',r.get('count'),'pages',r.get('pages'))
              for x in (r.get('data') or [])[:3]: print(json.dumps(x,ensure_ascii=False)[:1200])
          PY
