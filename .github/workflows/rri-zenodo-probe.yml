name: RRI Zenodo Financial Probe
on:
  push:
    branches: [rri-operating-experiment]
    paths:
      - '.github/workflows/rri-zenodo-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download representative Zenodo statement files
        run: |
          set -euxo pipefail
          curl -L --fail --retry 2 --connect-timeout 30 -o profit.csv 'https://zenodo.org/records/20032245/files/2018.1.1-2020.12.31%E5%88%A9%E6%B6%A6.csv?download=1'
          curl -L --fail --retry 2 --connect-timeout 30 -o balance.csv 'https://zenodo.org/records/20032245/files/2017.5.1-2020.12.31%E8%B5%84%E4%BA%A7%E8%B4%9F%E5%80%BA.csv?download=1'
          ls -lh profit.csv balance.csv
      - name: Print detected columns and sample rows
        run: |
          python - <<'PY'
          import pandas as pd
          for p in ['profit.csv','balance.csv']:
              print('\n===', p, '===')
              ok=False
              for enc in ['utf-8-sig','utf-8','gb18030','gbk']:
                  try:
                      df=pd.read_csv(p,encoding=enc,nrows=5,low_memory=False)
                      print('ENCODING',enc)
                      print('COLUMNS',list(df.columns))
                      print(df.head(3).to_string(index=False)[:12000])
                      ok=True
                      break
                  except Exception as e:
                      print('FAIL',enc,type(e).__name__,str(e)[:300])
              if not ok: raise RuntimeError('cannot decode '+p)
          PY
