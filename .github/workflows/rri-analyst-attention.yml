name: RRI Analyst Attention Secondary Test
on:
  push:
    branches: [rri-operating-experiment]
    paths:
      - 'rri_experiment/run_rri_analyst_attention.py'
      - 'rri_experiment/ANALYST_ATTENTION_FREEZE_20260907.md'
      - '.github/workflows/rri-analyst-attention.yml'
  workflow_dispatch:

jobs:
  analyst-attention:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy statsmodels pyreadstat
      - name: Pull public analyst-attention source
        run: |
          mkdir -p external_attention
          curl -L --fail --retry 3 -o external_attention/CSMAR_cleaned_data.csv 'https://raw.githubusercontent.com/gaosiyuan1995/dshw-p02b/main/data/clean/CSMAR_cleaned_data.csv'
          ls -lh external_attention/CSMAR_cleaned_data.csv
      - name: Pull public annual financial controls
        run: |
          git lfs install
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://github.com/renzhongxing9/Ashare-control-vars.git external_controls
          cd external_controls
          git lfs pull --include='data/c_output/ControlVars_Y.dta'
          ls -lh data/c_output/ControlVars_Y.dta
      - name: Run frozen analyst-attention test
        run: python rri_experiment/run_rri_analyst_attention.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rri-analyst-attention-results
          path: rri_experiment/analyst_attention_results/
          if-no-files-found: warn
