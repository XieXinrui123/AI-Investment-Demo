name: RRI 2014 Recovery Final OP Run

on:
  push:
    branches: ["rri-op-2014-recovery-20260906"]

jobs:
  recover-and-rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests pyarrow statsmodels beautifulsoup4 lxml
      - name: Restore frozen RRI and full-rank implementation
        run: |
          mkdir -p rri_op_input rri_op_results_2014recovery rri_op_public_fast rri_op_2014_recovery
          cp rri_op/RRI_FIRM_YEAR_232_MIN.csv rri_op_input/RRI_FIRM_YEAR_232_v2.3m_OP_COMPAT.csv
          base64 -d rri_op/test_rri_operating_performance_v1_0.py.gz.b64 | gzip -d > rri_op_input/test_rri_operating_performance_v1_0.py
          python rri_op/patch_fullrank_v1_1.py
          python -m py_compile rri_op_input/test_rri_operating_performance_v1_1_fullrank.py rri_op/build_open_financial_panel_fast.py rri_op/recover_2014_financials.py
      - name: Rebuild unchanged public panel
        run: python rri_op/build_open_financial_panel_fast.py 2>&1 | tee rri_op_public_fast/build.log
      - name: Recover 2014 pre-period rows and audit source concordance
        run: python rri_op/recover_2014_financials.py 2>&1 | tee rri_op_2014_recovery/recovery.log
      - name: Run final frozen full-rank specification
        run: |
          python rri_op_input/test_rri_operating_performance_v1_1_fullrank.py \
            --financial rri_op_2014_recovery/OPEN_FINANCIAL_PANEL_2014_2025_WITH_2014_RECOVERY.csv \
            --rri rri_op_input/RRI_FIRM_YEAR_232_v2.3m_OP_COMPAT.csv \
            --outdir rri_op_results_2014recovery 2>&1 | tee rri_op_results_2014recovery/regression.log
      - name: Build final audit summary
        run: |
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          p=Path('rri_op_results_2014recovery')
          res=pd.read_csv(p/'RRI_OPERATING_PERFORMANCE_RESULTS.csv')
          cov=pd.read_csv(p/'RRI_OPERATING_PERFORMANCE_COVERAGE.csv')
          con=pd.read_csv('rri_op_2014_recovery/SOURCE_CONCORDANCE_2015_SUMMARY.csv')
          rec=pd.read_csv('rri_op_2014_recovery/RECOVERED_2014_ROWS.csv')
          fail=pd.read_csv('rri_op_2014_recovery/EASTMONEY_2014_RECOVERY_FAILURES.csv') if Path('rri_op_2014_recovery/EASTMONEY_2014_RECOVERY_FAILURES.csv').stat().st_size>4 else pd.DataFrame()
          primary=res[(res.outcome=='roa_post')&(res.model=='P3')&(res.rri_variable=='AnnualRRI10')&(res.first_event_only==0)].iloc[0]
          lines=[f'2014 recovered complete rows: {len(rec)}',f'2014 recovery failures: {len(fail)}','', '=== 2015 SOURCE CONCORDANCE ===',con.to_string(index=False),'','=== COVERAGE ===',cov.to_string(index=False),'','=== RESULTS ===',res.to_string(index=False),'',f"FINAL_PRIMARY_P3_ROA N={int(primary.N)} beta10={primary.beta_RRI10} se={primary.se_cluster} p={primary.p_cluster} r2={primary.r2} rank={int(primary.matrix_rank)}/{int(primary.n_regressors)}"]
          (p/'FINAL_AUDIT_SUMMARY.txt').write_text('\n'.join(lines),encoding='utf-8')
          manifest={
            'sample':'Clean Core v2.3m, 232 firm-years / 217 firms',
            'recovery_scope':'Only fiscal-year 2014 financial rows for the already-fixed 2015 RRI cohort; no outcome-based sample selection.',
            'recovery_source':'Eastmoney PC_HSF10 NewFinanceAnalysis zcfzbAjaxNew + lrbAjaxNew',
            'recovery_fields':{'total_assets':'TOTAL_ASSETS','total_liabilities':'TOTAL_LIABILITIES','cash':'MONETARYFUNDS','operating_revenue':'TOTAL_OPERATE_INCOME','net_profit':'NETPROFIT'},
            'overlap_validation_year':2015,
            'model':'same frozen full-rank P3 implementation v1.1',
            'decision_rule':'Operating-performance line is judged from the frozen primary ROA P3; secondary outcomes cannot rescue a null primary.'
          }
          (p/'FINAL_RUN_MANIFEST.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print((p/'FINAL_AUDIT_SUMMARY.txt').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rri-op-2014-recovery-final-${{ github.run_id }}
          path: |
            rri_op_input/RRI_FIRM_YEAR_232_v2.3m_OP_COMPAT.csv
            rri_op_input/test_rri_operating_performance_v1_1_fullrank.py
            rri_op_public_fast
            rri_op_2014_recovery
            rri_op_results_2014recovery
