name: RRI 2014 Financial Recovery Probe

on:
  push:
    branches: ["rri-op-2014-recovery-20260906"]

jobs:
  probe-2014:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip requests pandas beautifulsoup4 lxml
      - name: Probe Eastmoney 2014 balance and income fields
        run: |
          mkdir -p rri_op_2014_probe
          python - <<'PY' > rri_op_2014_probe/probe.txt 2>&1
          import re, requests, pandas as pd
          from bs4 import BeautifulSoup
          UA={'User-Agent':'Mozilla/5.0','Referer':'https://emweb.securities.eastmoney.com/'}
          def sym(code):
              return ('SH' if str(code).startswith(('5','6','9')) else 'SZ')+str(code).zfill(6)
          def ctype(symbol):
              u='https://emweb.securities.eastmoney.com/PC_HSF10/NewFinanceAnalysis/Index'
              r=requests.get(u,params={'type':'web','code':symbol.lower()},timeout=20,headers=UA)
              print(symbol,'index',r.status_code,len(r.text))
              s=BeautifulSoup(r.text,'lxml'); x=s.find(attrs={'id':'hidctype'})
              return x['value'] if x else None
          def fetch(symbol,kind,ct):
              ep={'bal':'zcfzbAjaxNew','inc':'lrbAjaxNew'}[kind]
              u=f'https://emweb.securities.eastmoney.com/PC_HSF10/NewFinanceAnalysis/{ep}'
              p={'companyType':ct,'reportDateType':'0','reportType':'1','dates':'2014-12-31','code':symbol}
              r=requests.get(u,params=p,timeout=20,headers=UA)
              print(kind,'status',r.status_code,'bytes',len(r.content))
              try:j=r.json()
              except Exception as e: print('jsonerr',repr(e),r.text[:500]); return
              rows=j.get('data') or []
              print(kind,'rows',len(rows))
              if rows:
                  print(kind,'keys',sorted(rows[0].keys()))
                  print(kind,'row',rows[0])
          for code in ['600879','000010','600061','300058']:
              symbol=sym(code); print('\n===',symbol,'===')
              try:
                  ct=ctype(symbol); print('ctype',ct)
                  for k in ['bal','inc']:
                      fetch(symbol,k,ct)
              except Exception as e: print(type(e).__name__,repr(e))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rri-op-2014-probe-${{ github.run_id }}
          path: rri_op_2014_probe
