name: RRI AEM Eastmoney Three Statements Probe

on:
  push:
    branches: ["rri-aem-20260906"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip requests pandas
      - name: Probe balance income cashflow whole-market schemas
        run: |
          mkdir -p rri_aem_em3_probe
          python - <<'PY' > rri_aem_em3_probe/probe.txt 2>&1
          import requests, pandas as pd
          url='https://datacenter-web.eastmoney.com/api/data/v1/get'
          h={'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'}
          reports=['RPT_DMSK_FN_BALANCE','RPT_DMSK_FN_INCOME','RPT_DMSK_FN_CASHFLOW']
          for rep in reports:
              print('\n===',rep,'===')
              p={'reportName':rep,'columns':'ALL','pageNumber':'1','pageSize':'3',
                 'sortColumns':'SECURITY_CODE','sortTypes':'1',
                 'filter':"(REPORT_DATE='2023-12-31')"}
              r=requests.get(url,params=p,headers=h,timeout=40); print('status',r.status_code,'bytes',len(r.content))
              j=r.json(); rr=j.get('result') or {}; data=rr.get('data') or []
              print('success',j.get('success'),'pages',rr.get('pages'),'count',rr.get('count'))
              if data:
                  print('KEYS')
                  print('\n'.join(sorted(data[0].keys())))
                  print('SAMPLE')
                  print(pd.DataFrame(data).head(3).to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rri-aem-em3-probe-${{ github.run_id }}
          path: rri_aem_em3_probe
