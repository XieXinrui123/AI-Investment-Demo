name: RRI Report Based Institution Visit Coverage Audit

on:
  push:
    branches:
      - rri-institution-visit-pilot-20260907
    paths:
      - 'rri_institution_visit_pilot/run_report_based_coverage_audit.py'
      - 'rri_institution_visit_pilot/PILOT_SAMPLE_30.csv'
      - '.github/workflows/rri_report_based_coverage_audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests pymupdf
      - name: Run report-based 30-event coverage audit
        run: python rri_institution_visit_pilot/run_report_based_coverage_audit.py
      - name: Print coverage summary
        run: |
          cat rri_institution_visit_pilot/output_report_audit/04_SUMMARY.json
          cat rri_institution_visit_pilot/output_report_audit/05_COVERAGE_GATE.md
      - uses: actions/upload-artifact@v4
        with:
          name: RRI_REPORT_BASED_COVERAGE_AUDIT_30
          path: rri_institution_visit_pilot/output_report_audit
          retention-days: 30
